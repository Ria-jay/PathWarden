[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pathwarden"
dynamic = ["version"]
description = "Static configuration and execution-log provenance analyzer for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ria-jay", email = "jayglow01@gmail.com" }]
keywords = ["ai", "security", "agent", "static-analysis", "mcp", "supply-chain"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.5,<3",
    "networkx>=3.1,<4",
    "PyYAML>=6.0,<7",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
    "types-networkx>=3.1",
]

[project.scripts]
pathwarden = "pathwarden.cli.app:app"

[tool.hatch.version]
path = "src/pathwarden/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pathwarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]

[tool.ruff.lint.flake8-bugbear]
# Typer builds options/arguments from these calls; they are intentionally immutable.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["pathwarden"]
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
