schema_version: "1.0"

agent:
  id: assistant
  name: Unknown Identity Assistant
  execution_identity: assistant-identity

identities:
  - id: assistant-identity
    type: service_account

input_sources:
  - id: user-chat
    name: User chat
    type: user_message
    trust: user

tools:
  - id: doc-reader
    name: Document reader
    operations: [read]
    identity: missing-identity

resources:
  - id: docs
    type: document_store
    sensitivity: internal
    owner: team
    tenant: acme
