schema_version: "1.0"

agent:
  id: assistant
  name: Unknown Flow Target Assistant
  execution_identity: assistant-identity

identities:
  - id: assistant-identity
    type: service_account

tools:
  - id: doc-reader
    name: Document reader
    operations: [read]
    identity: assistant-identity
    output_flows_to: [nonexistent-tool]

resources:
  - id: docs
    type: document_store
    sensitivity: internal
    owner: team
    tenant: acme
